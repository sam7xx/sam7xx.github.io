    - <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">  # fontawesome动态图标引入
    - <script src="/js/darkmode.js"></script>  # hexo暗黑模式切换工具
    - <script src="/js/vercel-analytics.js"></script>  # Vercel Analytics
   #- <script src="/js/sakura.js"></script>  # 樱花特效
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">  # APlayer 音乐播放器样式
  script:
    - <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>  # APlayer 核心
    - "<script>if(!document.querySelector('meting-js,#global-player')){(function(){var w=document.createElement('div');w.id='global-player';var m=document.createElement('meting-js');m.className='aplayer';m.setAttribute('server','netease');m.setAttribute('type','playlist');m.setAttribute('id','3136952023');m.setAttribute('autoplay','false');m.setAttribute('theme','#2980b9');m.setAttribute('loop','all');m.setAttribute('order','list');m.setAttribute('preload','none');m.setAttribute('volume','0.1');m.setAttribute('lrc-type','0');w.appendChild(m);document.body.appendChild(w);})();}</script>"  # 播放器创建：meting 元素包在 #global-player 容器内（meting 用 id 属性作歌单ID，故容器用包裹div标记）
    - <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>  # Meting 解析
    - '<div id="player-fab" title="音乐播放器"><i class="fa-solid fa-music"></i></div>'  # 悬浮按钮（默认收起）
    - "<script>(function(){if(window.__playerFabInit)return;window.__playerFabInit=true;var f=document.getElementById('player-fab');f.addEventListener('click',function(){var p=document.getElementById('global-player');if(p){p.classList.toggle('player-open');p.classList.add('aplayer-withlist');}});document.addEventListener('click',function(e){if(e.defaultPrevented)return;var t=e.target&&e.target.closest?e.target.closest('.fa-circle-half-stroke,a[title=\"主题切换\"]'):null;if(!t)return;e.preventDefault();if(typeof toggleTheme==='function'){toggleTheme()}else if(typeof switchTheme==='function'){switchTheme()}});})();</script>"  # 悬浮按钮切换 #global-player + 主题切换委托（pjax 后仍有效）
    - "<script>(function(){if(window.__stellarPjax)return;window.__stellarPjax=true;var loadedSrcs=new Set();document.querySelectorAll('script').forEach(function(s){if(s.src)loadedSrcs.add(s.src)});function execScripts(root){if(!root)return;root.querySelectorAll('script').forEach(function(old){if(old.src){if(loadedSrcs.has(old.src))return;loadedSrcs.add(old.src);var s=document.createElement('script');s.src=old.src;document.head.appendChild(s)}else if(old.text.trim()){var s=document.createElement('script');s.text=old.text;document.body.appendChild(s)}})}function swap(url,push){fetch(url,{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(html){var doc=new DOMParser().parseFromString(html,'text/html');var nb=doc.getElementById('start');if(!nb)throw 0;var cur=document.getElementById('start');document.title=doc.title;cur.innerHTML=nb.innerHTML;execScripts(nb);execScripts(doc.querySelector('.scripts'));if(push)history.pushState({url:url},'',url);window.scrollTo(0,0)}).catch(function(){location.href=url})}document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;var href=a.getAttribute('href')||'';if(e.defaultPrevented||e.button!==0||a.target||a.hasAttribute('download')||href.charAt(0)==='#'||href.indexOf('mailto:')===0||href.indexOf('javascript:')===0||a.origin!==location.origin)return;e.preventDefault();swap(a.href,true)});window.addEventListener('popstate',function(){swap(location.href,false)});})();</script>"  # pjax 无刷新导航（音乐不断播）
